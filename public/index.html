<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANNA BUSINESS — Boutique de mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#211735; --ink-soft:#4d4360; --surface:#f7f2e6; --surface-raised:#fffdf8;
    --line:#e2d7bd; --gold:#b98a2e; --gold-soft:#e4c98a; --berry:#8f2f45; --berry-soft:#f1dbe0; --green:#445c40;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--surface); color:var(--ink); font-family:'Work Sans',system-ui,sans-serif; line-height:1.5; }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; font-weight:500; margin:0; }
  a { color:inherit; } button { font-family:inherit; cursor:pointer; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 24px; }
  header { position:sticky; top:0; z-index:40; background:rgba(247,242,230,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .header-row { display:flex; align-items:center; justify-content:space-between; padding:16px 0; gap:16px; }
  .logo { font-family:'Fraunces',serif; font-size:1.4rem; font-weight:600; display:flex; align-items:center; gap:8px; }
  .logo img { height:40px; width:40px; border-radius:50%; object-fit:cover; }
  nav.cats { display:flex; gap:4px; background:var(--surface-raised); border:1px solid var(--line); border-radius:999px; padding:4px; }
  nav.cats button { border:none; background:transparent; color:var(--ink-soft); padding:8px 16px; border-radius:999px; font-size:0.88rem; }
  nav.cats button.active { background:var(--berry); color:#fff8f2; }
  .cart-btn { border:1px solid var(--line); background:var(--surface-raised); border-radius:999px; padding:8px 16px; display:flex; align-items:center; gap:8px; }
  .cart-count { background:var(--berry); color:#fff8f2; font-size:0.7rem; min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:32px 0 60px; }
  @media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} nav.cats{display:none;} }
  .card { border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface-raised); display:flex; flex-direction:column; }
  .card-art { aspect-ratio:1/1; background:var(--gold-soft); overflow:hidden; cursor:pointer; }
  .card-art img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; }
  .card-body h3 { font-size:1rem; cursor:pointer; }
  .desc { color:var(--ink-soft); font-size:0.82rem; }
  .card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .price { font-family:'Fraunces',serif; }
  .add-btn { border:1px solid var(--berry); color:var(--berry); background:none; border-radius:999px; padding:6px 14px; font-size:0.82rem; }
  .add-btn:hover { background:var(--berry); color:#fff; }
  .empty-state { text-align:center; color:var(--ink-soft); padding:60px 0; grid-column:1/-1; }
  .overlay { position:fixed; inset:0; background:rgba(20,14,10,0.45); display:none; align-items:center; justify-content:center; z-index:70; padding:16px; }
  .overlay.open { display:flex; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:min(400px,92vw); background:var(--surface); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .25s; z-index:71; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer-head { padding:18px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .drawer-items { flex:1; overflow-y:auto; padding:14px 20px; display:flex; flex-direction:column; gap:14px; }
  .drawer-foot { border-top:1px solid var(--line); padding:16px 20px 20px; }
  .line-item { display:flex; gap:10px; align-items:center; }
  .li-art { width:52px; height:52px; border-radius:8px; overflow:hidden; border:1px solid var(--line); flex:none; }
  .li-art img { width:100%; height:100%; object-fit:cover; }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:var(--surface-raised); }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:999px; border:none; font-size:0.9rem; }
  .btn-primary { background:var(--berry); color:#fff8f2; width:100%; justify-content:center; }
  .modal { background:var(--surface-raised); border:1px solid var(--line); border-radius:18px; max-width:420px; width:100%; padding:24px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:0.78rem; color:var(--ink-soft); margin-bottom:4px; }
  .field input { width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface); }
  .pay-opt { flex:1; border:1px solid var(--line); border-radius:9px; padding:9px; text-align:center; font-size:0.8rem; color:var(--ink-soft); }
  .pay-opt.active { border-color:var(--berry); color:var(--berry); background:var(--berry-soft); }
  .pay-options { display:flex; gap:8px; margin-bottom:8px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--surface); padding:10px 18px; border-radius:999px; font-size:0.84rem; opacity:0; transition:.25s; z-index:80; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  footer { padding:30px 0 50px; color:var(--ink-soft); font-size:0.82rem; text-align:center; }
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <div class="logo"><img src="/logo.jpg" onerror="this.style.display='none'" alt="">HANNA BUSINESS</div>
    <nav class="cats" id="catsNav">
      <button data-cat="tous" class="active">Tout</button>
      <button data-cat="femme">Femme</button>
      <button data-cat="homme">Homme</button>
      <button data-cat="enfant">Enfant</button>
    </nav>
    <button class="cart-btn" id="cartBtn">Panier <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"><div class="empty-state">Chargement du catalogue…</div></div>
</main>

<footer>© 2026 HANNA BUSINESS · Commandes via <a id="waLink" href="#">WhatsApp</a></footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3>Votre panier</h3><button id="drawerClose" style="border:none;background:none;font-size:1.2rem;">✕</button></div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-family:'Fraunces',serif;font-size:1.1rem;"><span>Total</span><span id="drawerTotal">0 GNF</span></div>
    <button class="btn btn-primary" id="checkoutBtn">Passer la commande</button>
  </div>
</aside>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3 style="margin-bottom:14px;">Finaliser la commande</h3>
    <div class="field"><label>Nom complet</label><input id="custName" placeholder="Ex: Fatoumata Camara"></div>
    <div class="field"><label>Téléphone</label><input id="custPhone" placeholder="Ex: 622 00 00 00"></div>
    <div class="field"><label>Adresse / quartier</label><input id="custAddr" placeholder="Ex: Kaloum, Conakry"></div>
    <div class="field">
      <label>Paiement</label>
      <div class="pay-options">
        <div class="pay-opt active" data-pay="mobile">Mobile money</div>
        <div class="pay-opt" data-pay="cash">Espèces</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="btn" style="border:1px solid var(--line);background:none;flex:1;" id="modalCancel">Annuler</button>
      <button class="btn btn-primary" style="flex:2;" id="modalSend">Confirmer la commande</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WHATSAPP_NUMBER = "224613305410";
document.getElementById("waLink").href = `https://wa.me/${WHATSAPP_NUMBER}`;

let products = [];
let currentCat = "tous";
let cart = JSON.parse(localStorage.getItem("hanna_cart") || "{}");

function fmt(n){ return n.toLocaleString('fr-FR') + " GNF"; }
function saveCart(){ localStorage.setItem("hanna_cart", JSON.stringify(cart)); }

async function loadProducts() {
  try {
    const res = await fetch("/api/products");
    products = await res.json();
    renderGrid();
  } catch (e) {
    document.getElementById("grid").innerHTML = '<div class="empty-state">Impossible de charger le catalogue pour le moment.</div>';
  }
}

function imgTag(p) {
  return p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:0.8rem;">Photo à venir</div>`;
}

function renderGrid() {
  const list = currentCat === "tous" ? products : products.filter(p => p.cat === currentCat);
  const grid = document.getElementById("grid");
  if (!list.length) { grid.innerHTML = '<div class="empty-state">Aucun article dans cette catégorie pour le moment.</div>'; return; }
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="card-art" data-open="${p.id}">${imgTag(p)}</div>
      <div class="card-body">
        <h3 data-open="${p.id}">${p.name}</h3>
        <div class="desc">${p.desc || ""}</div>
        <div class="card-foot">
          <span class="price">${fmt(p.price)}</span>
          <button class="add-btn" data-add="${p.id}">Ajouter</button>
        </div>
      </div>
    </div>
  `).join("");
}

document.querySelectorAll("#catsNav button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentCat = btn.dataset.cat;
    document.querySelectorAll("#catsNav button").forEach(b => b.classList.toggle("active", b === btn));
    renderGrid();
  });
});

document.getElementById("grid").addEventListener("click", (e) => {
  const addId = e.target.dataset.add;
  const openId = e.target.dataset.open;
  if (addId) { cart[addId] = (cart[addId]||0)+1; saveCart(); renderCart(); showToast("Ajouté au panier"); return; }
  if (openId) { cart[openId] = (cart[openId]||0)+1; saveCart(); renderCart(); showToast("Ajouté au panier"); }
});

function cartLines() {
  return Object.entries(cart).map(([id,qty]) => ({ p: products.find(p=>p.id===id), qty })).filter(l=>l.p);
}
function renderCart() {
  const lines = cartLines();
  const totalQty = lines.reduce((s,l)=>s+l.qty,0);
  const totalPrice = lines.reduce((s,l)=>s+l.qty*l.p.price,0);
  document.getElementById("cartCount").textContent = totalQty;
  document.getElementById("drawerTotal").textContent = fmt(totalPrice);
  const el = document.getElementById("drawerItems");
  if (!lines.length) { el.innerHTML = '<div style="text-align:center;color:var(--ink-soft);margin-top:30px;">Panier vide</div>'; return; }
  el.innerHTML = lines.map(l => `
    <div class="line-item">
      <div class="li-art">${imgTag(l.p)}</div>
      <div style="flex:1;"><div style="font-size:0.9rem;">${l.p.name}</div><div style="font-size:0.8rem;color:var(--ink-soft);">${fmt(l.p.price)}</div></div>
      <div class="qty"><button data-dec="${l.p.id}">−</button><span>${l.qty}</span><button data-inc="${l.p.id}">+</button></div>
    </div>
  `).join("");
}
document.getElementById("drawerItems").addEventListener("click", (e) => {
  const inc=e.target.dataset.inc, dec=e.target.dataset.dec;
  if (inc) cart[inc]=(cart[inc]||0)+1;
  if (dec) { cart[dec]=(cart[dec]||0)-1; if(cart[dec]<=0) delete cart[dec]; }
  saveCart(); renderCart();
});

const overlay = document.getElementById("overlay"), drawer = document.getElementById("drawer");
document.getElementById("cartBtn").addEventListener("click", ()=>{ overlay.classList.add("open"); drawer.classList.add("open"); });
document.getElementById("drawerClose").addEventListener("click", ()=>{ overlay.classList.remove("open"); drawer.classList.remove("open"); });
overlay.addEventListener("click", ()=>{ overlay.classList.remove("open"); drawer.classList.remove("open"); });

const modalOverlay = document.getElementById("modalOverlay");
let payMode = "mobile";
document.querySelectorAll(".pay-opt").forEach(el => el.addEventListener("click", ()=>{
  document.querySelectorAll(".pay-opt").forEach(o=>o.classList.remove("active"));
  el.classList.add("active"); payMode = el.dataset.pay;
}));
document.getElementById("checkoutBtn").addEventListener("click", ()=>{
  if (!cartLines().length) { showToast("Panier vide"); return; }
  modalOverlay.classList.add("open");
});
document.getElementById("modalCancel").addEventListener("click", ()=> modalOverlay.classList.remove("open"));

document.getElementById("modalSend").addEventListener("click", async () => {
  const name = document.getElementById("custName").value.trim();
  const phone = document.getElementById("custPhone").value.trim();
  const addr = document.getElementById("custAddr").value.trim();
  const lines = cartLines();
  try {
    const res = await fetch("/api/orders", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        items: lines.map(l => ({ id: l.p.id, qty: l.qty })),
        customer: { name, phone, address: addr },
        payment: { method: payMode }
      })
    });
    const order = await res.json();
    if (!res.ok) throw new Error(order.error || "Erreur");

    if (payMode === "mobile") {
      const payRes = await fetch("/api/payment/initiate", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ orderId: order.id })
      });
      const payData = await payRes.json();
      if (payRes.ok && payData.payment_url) {
        window.location.href = payData.payment_url;
        return;
      }
      // Paiement OM pas encore activé -> on bascule sur confirmation WhatsApp
    }
    let msg = `Bonjour HANNA BUSINESS, commande n°${order.id.slice(0,8)} :%0A%0A`;
    lines.forEach(l => msg += `• ${l.p.name} x${l.qty} — ${fmt(l.p.price*l.qty)}%0A`);
    msg += `%0ATotal : ${fmt(order.total)}%0A`;
    msg += `Paiement : ${payMode === "mobile" ? "Mobile money" : "Espèces à la livraison"}%0A`;
    if (name) msg += `Nom : ${name}%0A`;
    if (phone) msg += `Téléphone : ${phone}%0A`;
    if (addr) msg += `Adresse : ${addr}%0A`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
    cart = {}; saveCart(); renderCart();
    modalOverlay.classList.remove("open");
  } catch (e) {
    showToast("Erreur : " + e.message);
  }
});

let toastTimer;
function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

loadProducts();
renderCart();
</script>
</body>
</html>
